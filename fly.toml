# Fly.io app for the hosted connector. `fly deploy` from the repo root builds
# the Dockerfile and rolls the app. Same layout as the pricing hub
# (OptimNow/ai-pricing-hub-mcp) and the Cloud FinOps connector
# (OptimNow/cloud-finops-skills), which left Alpic when its shared free quota
# returned HTTP 402 to every OptimNow connector.
#
# The public URL is https://airoicalculator-mcp.optimnow.io/mcp: a custom domain
# (CNAME airoicalculator-mcp.optimnow.io -> ai-roi-calculator-mcp.fly.dev in the
# optimnow.io zone, certificate issued with `fly certs add`). The /mcp path is
# required: Fly does not map the root the way Alpic did. That URL is one
# constant, PUBLIC_MCP_URL in server/src/public-url.ts, and the claude.ai widget
# sandbox domain is a hash of it, pinned by a test, so the URL, this comment and
# PUBLIC_APP_ORIGIN below move together. The ai-roi-calculator-mcp.fly.dev host
# still answers tool calls but the widget does not render through it.
#
# Scale-to-zero: the machine stops when idle and restarts on the next request,
# so a quiet month costs only the stopped machine's root filesystem. The
# hour-long catalogue cache in catalog.ts lives per wake as a result. Set
# min_machines_running = 1 to keep one machine (and its cache) warm.

# The app name is also the *.fly.dev hostname, so it is part of the CNAME.
app = "ai-roi-calculator-mcp"

# Paris, beside the other OptimNow connectors.
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  # Must equal internal_port below and what the Dockerfile sets.
  PORT = "8080"
  # The origin of PUBLIC_MCP_URL. index.ts reads it into the widget CSP lists
  # and the ChatGPT-side widget domain; public-url.test.ts checks it matches.
  PUBLIC_APP_ORIGIN = "https://airoicalculator-mcp.optimnow.io"

[http_service]
  internal_port = 8080
  # Fly terminates TLS; plain HTTP never reaches the app.
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # No HTTP health check on purpose: the MCP endpoint answers GET /mcp with 405
  # and GET / with 404, and Skybridge exposes no health route. Fly's TCP
  # readiness on internal_port is enough to know the process is listening.

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
